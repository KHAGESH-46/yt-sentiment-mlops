      #     registry into models/model.joblib (mlflow artifacts download).
      #  2. Trigger the actual deployment, e.g. Render deploy hook:
      #     run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      #  3. Smoke test the live API:
      #     run: curl -fsS "$URL/health" | grep '"status":"ok"'
